name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  build-and-test:
    name: Compile & Unit Test Microservices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Compile all 17 microservices
        run: |
          for svc in \
            discovery-service \
            configuration-service \
            gateway-service \
            analytics-service \
            appointment-service \
            billing-service \
            chatbot-service \
            clinic-service \
            consultation-service \
            medical-record-service \
            medication-service \
            notification-service \
            patient-service \
            payment-service \
            prescription-service \
            queue-service \
            user-service; do
            echo "=== Compiling $svc ==="
            (cd "$svc" && mvn -B -ntp test-compile)
          done

      - name: Run unit tests
        run: |
          (cd discovery-service && mvn -B -ntp test)
          for svc in \
            appointment-service \
            clinic-service \
            consultation-service \
            medical-record-service \
            medication-service \
            notification-service \
            patient-service \
            prescription-service; do
            echo "=== Testing $svc ==="
            (cd "$svc" && mvn -B -ntp test -Dtest='!*ApplicationTests')
          done
