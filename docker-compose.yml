services:
  postgres:
    image: postgres:16-alpine
    container_name: medicare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_admin}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:-change_me_analytics}
      APPOINTMENT_PASSWORD: ${APPOINTMENT_PASSWORD:-change_me_appointment}
      BILLING_PASSWORD: ${BILLING_PASSWORD:-change_me_billing}
      CHATBOT_PASSWORD: ${CHATBOT_PASSWORD:-change_me_chatbot}
      CLINIC_PASSWORD: ${CLINIC_PASSWORD:-change_me_clinic}
      CONSULTATION_PASSWORD: ${CONSULTATION_PASSWORD:-change_me_consultation}
      MEDICAL_RECORD_PASSWORD: ${MEDICAL_RECORD_PASSWORD:-change_me_medical_record}
      MEDICATION_PASSWORD: ${MEDICATION_PASSWORD:-change_me_medication}
      NOTIFICATION_PASSWORD: ${NOTIFICATION_PASSWORD:-change_me_notification}
      PATIENT_PASSWORD: ${PATIENT_PASSWORD:-change_me_patient}
      PAYMENT_PASSWORD: ${PAYMENT_PASSWORD:-change_me_payment}
      PRESCRIPTION_PASSWORD: ${PRESCRIPTION_PASSWORD:-change_me_prescription}
      QUEUE_PASSWORD: ${QUEUE_PASSWORD:-change_me_queue}
      USER_PASSWORD: ${USER_PASSWORD:-change_me_user}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres_admin}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - medicare-network

  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: medicare-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - medicare-network

  configuration-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: configuration-service
    container_name: configuration-service
    ports:
      - "8888:8888"
    env_file:
      - path: ./env/configuration-service.env
        required: false
    networks:
      - medicare-network
    restart: unless-stopped

  discovery-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - medicare-network
    restart: unless-stopped

  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway-service
    container_name: gateway-service
    depends_on:
      discovery-service:
        condition: service_started
        required: true
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
    env_file:
      - path: ./env/gateway-service.env
        required: false
    networks:
      - medicare-network
    ports:
      - "8080:8080"
    restart: unless-stopped

  patient-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: patient-service
    container_name: patient-service
    ports:
      - "8081:8080"
    env_file:
      - path: ./env/patient-service.env
        required: false
    networks:
      - medicare-network
    depends_on:
      - discovery-service
      - postgres
      - broker
    restart: unless-stopped

  appointment-service:
